<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>村超经理 · 点击即玩</title>
<style>
:root{--bg:#0d1f18;--card:#173a2c;--line:#2c5c45;--txt:#eafff2;--sub:#a9c9b8;--gold:#ffd36a;--green:#5ee6a8;--red:#ff718c;--blue:#7fd4ff;--grass:#3fbf76}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:radial-gradient(900px 520px at 50% -10%,#1d5c3f 0%,var(--bg) 66%);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{padding:14px 12px 86px}.app{max-width:520px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.iconbtn{border:1px solid var(--line);background:rgba(23,58,44,.86);color:var(--txt);border-radius:12px;padding:9px 12px;font-size:13px;cursor:pointer}.iconbtn.primary{background:linear-gradient(135deg,#ffd36a,#ff9f68);color:#251800;border:0;font-weight:700}.iconbtn.ghost{background:transparent}.titlebox{flex:1;text-align:center}.gametitle{font-size:16px;font-weight:800}.channel{font-size:10px;color:var(--sub);margin-top:2px}
.hero{padding:18px 16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(30,82,58,.96),rgba(13,40,28,.96));box-shadow:0 12px 34px rgba(0,0,0,.24);margin-bottom:12px}.kicker{display:inline-block;font-size:11px;color:#10251c;background:var(--gold);border-radius:999px;padding:4px 10px;font-weight:800}.hero h1{font-size:27px;line-height:1.18;margin:10px 0 6px}.hero p{font-size:12px;color:var(--sub);line-height:1.65}.hero .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hero .row .iconbtn{flex:1;min-width:105px}.notice{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(127,212,255,.10);border:1px solid rgba(127,212,255,.24);font-size:12px;line-height:1.6;color:#d7e8ff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:rgba(23,58,44,.92);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}.stat .k{font-size:11px;color:var(--sub)}.stat .v{font-size:17px;font-weight:800;margin-top:4px}.stat .v.bad{color:var(--red)}.stat .v.good{color:var(--green)}
.panel{background:rgba(13,40,28,.94);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.panel h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}.panel h2 small{font-size:10px;color:var(--sub);font-weight:400}.phase{display:flex;gap:6px;margin-bottom:12px}.phase span{flex:1;text-align:center;font-size:10px;padding:7px 2px;border-radius:999px;color:var(--sub);background:#0e2a1e;border:1px solid var(--line)}.phase span.on{background:var(--gold);color:#1b1400;border-color:var(--gold);font-weight:800}
.optgroup{margin-bottom:12px}.optgroup h3{font-size:12px;color:var(--gold);margin:0 0 7px}.opts{display:grid;gap:7px}.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#102c20;color:var(--txt);border-radius:12px;padding:10px 12px;cursor:pointer}.opt.on{border-color:var(--gold);background:rgba(255,211,106,.12)}.opt b{display:block;font-size:13px;margin-bottom:3px}.opt span{display:block;font-size:11px;color:var(--sub);line-height:1.5}
.story{font-size:13px;line-height:1.75;color:#e8ffef;background:#0e2a1e;border-radius:12px;padding:12px;margin-bottom:10px;border-left:3px solid var(--grass)}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#102c20;color:var(--txt);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}.choice b{display:block;font-size:13px;margin-bottom:3px}.choice span{display:block;font-size:11px;color:var(--sub);line-height:1.5}
.npcs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.npc{background:#102c20;border:1px solid var(--line);border-radius:12px;padding:10px}.npc .n{font-size:12px;font-weight:800}.npc .r{font-size:10px;color:var(--sub);margin:3px 0 6px}.bar{height:6px;border-radius:99px;background:#08190f;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grass),var(--gold))}
.logs{font-size:11px;line-height:1.65;color:var(--sub);max-height:170px;overflow:auto}.logitem{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.08)}.reviewbox{background:#0e2a1e;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;line-height:1.8}
.dnav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,31,24,.96);border-top:1px solid var(--line);z-index:5}.dnav-inner{max-width:520px;margin:0 auto;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.dnav button{flex:1;border:0;background:transparent;color:var(--sub);font-size:12px;padding:8px 0}.dnav button.active{color:var(--gold);font-weight:800}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:rgba(8,20,12,.95);border:1px solid var(--line);color:var(--txt);padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.mask{position:fixed;inset:0;background:rgba(3,10,6,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.mask.show{display:flex}.modal{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:linear-gradient(145deg,#1c4834,#0e291c);border:1px solid var(--line);border-radius:20px;padding:16px}.modal h3{font-size:17px;margin-bottom:8px}.modal p{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:12px}.q{font-size:13px;font-weight:700;margin:10px 0 7px}.labels{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;background:#102c20;color:var(--txt)}.miniBtn{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:#102c20;color:var(--txt);padding:9px;margin:5px 0;font-size:12px;text-align:left}.poster{width:100%;max-width:420px;border-radius:16px;display:none}.poster.show{display:block}.hint{font-size:11px;color:var(--sub);text-align:center;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><button class="iconbtn ghost" id="backBtn" type="button">‹ 游戏墙</button><div class="titlebox"><div class="gametitle">村超经理</div><div class="channel" id="channel">渠道：直接打开</div></div><button class="iconbtn" id="modeBtn" type="button">手动模式</button></div>
  <section class="hero"><span class="kicker">一支村队，撑起一个村子的体面</span><h1>没钱、没外援、<br>只有一群真心爱踢球的人。</h1><p>赛季备战 → 赛季进行 → 赛季收官。会输球、会缺钱、会被嘲笑，也会在全村人的呐喊里赢下一场足以记很多年的比赛。</p><div class="row"><button class="iconbtn primary" id="posterBtn" type="button">生成赛季报告</button><button class="iconbtn" id="copyBtn" type="button">复制复盘文案</button><button class="iconbtn" id="shareBtn" type="button">喊乡亲来</button></div><div class="notice" id="dailyNotice">每次操作自动保存在本机浏览器；隔日回来领球队补给。</div></section>
  <section class="stats" id="stats"></section>
  <section class="panel"><div class="phase" id="phase"></div><div id="playPanel"></div></section>
  <section class="panel"><h2>关系记忆簿 <small>你的选择会被记住</small></h2><div class="npcs" id="npcs"></div></section>
  <section class="panel"><h2>村里最近发生 <small>本机记录</small></h2><div class="logs" id="logs"></div></section>
</div>
<nav class="dnav"><div class="dnav-inner"><button type="button" data-nav="hub">广场</button><button type="button" class="active" data-nav="cunchao">村超</button><button type="button" data-nav="liuxue">留学</button></div></nav>
<div class="toast" id="toast"></div>
<div class="mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="mask" id="posterMask"><div style="width:100%;max-width:420px;text-align:center"><img class="poster" id="posterImg" alt="赛季人生报告"><div class="hint">微信里长按图片保存；发群/朋友圈时配上复制的复盘文案。</div><button class="iconbtn" id="posterClose" type="button" style="margin-top:10px">关闭</button></div></div>
<script>
(function(){
'use strict';
var KEY='cunchao_sim_save_v2',CH_KEY='yeshi_projects_channel_v1',CODE_KEY='yeshi_projects_channel_v1_code',VERSION='2.0.0';
var CHANNELS={wechat_group:'微信群',moments:'朋友圈',mp_menu:'公众号菜单',mp_article:'公众号文章',qrcode:'二维码',entry_card:'游戏卡',direct:'直接打开'};
function $(id){return document.getElementById(id)}
function two(n){return n<10?'0'+n:String(n)}
function today(){var d=new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function getParam(n){var s=location.search.replace(/^\?/,'').split('&');for(var i=0;i<s.length;i++){var p=s[i].split('=');if(decodeURIComponent(p[0])===n)return decodeURIComponent(p[1]||'')}return ''}
function readJSON(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(t){var e=$('toast');e.textContent=t;e.className='toast show';clearTimeout(toast._t);toast._t=setTimeout(function(){e.className='toast'},2300)}
var NPCS={coach:{name:'老罗',role:'村里请来的教练',em:'📋'},mayor:{name:'王伯',role:'村委会主任',em:'🏛️'},star:{name:'阿龙',role:'主力前锋',em:'⚽'},rival:{name:'李队长',role:'邻村对手',em:'🔥'}};
var PLAN={
  budget:[{id:'thrift',label:'精打细算',desc:'少花钱，稳住账本，但装备和场地一般。',eff:{cash:200,form:-4,pitch:-4}},{id:'balance',label:'正常投入',desc:'该花的钱花，量入为出。',eff:{cash:0,form:4,pitch:4}},{id:'bold',label:'放手一搏',desc:'借钱也要把队养好，压力全压在成绩上。',eff:{cash:-320,form:12,pitch:12,support:4}}],
  style:[{id:'defend',label:'防守反击',desc:'稳守待机，弱队法宝，场面不好看。',eff:{form:3,support:-2}},{id:'control',label:'控球推进',desc:'掌控节奏，需要球员功底。',eff:{form:6,support:3}},{id:'attack',label:'全场猛攻',desc:'好看且提气，但后防容易出问题。',eff:{form:8,support:6,rep:3}}],
  sponsor:[{id:'shop',label:'找村口小店',desc:'小额赞助，人情味足，钱不多。',eff:{cash:120,support:5}},{id:'town',label:'拉镇上企业',desc:'钱多，但要应付条款和应酬。',eff:{cash:420,form:4,support:-3}},{id:'none',label:'不拉赞助',desc:'干净，但一切自己扛。',eff:{support:3,form:-3}}]
};
var EVENTS=[
{id:'training',title:'第一场训练就有人迟到',text:'说好晚上七点训练，来了七个人，两个说地里还有活。老罗把哨子吹得很响，没人理。',choices:[{label:'定规矩，迟到就减上场时间',hint:'状态上升，部分人情下降',eff:{form:8,support:-3},npc:{coach:5,star:-2},log:'你立了规矩，训练终于像训练了。'},{label:'先请大家吃顿饭再谈',hint:'支持上升，现金下降',eff:{support:8,cash:-120,form:2},npc:{star:5,mayor:4},log:'一顿饭后，人也齐了，话也好说了。'},{label:'算了，凑够人就行',hint:'人情保住，状态下降',eff:{support:2,form:-6},npc:{coach:-6},log:'你没立规矩，老罗摇了摇头。'}]},
{id:'fund',title:'账本快见底了',text:'王伯拿着账本找你：训练用水、球衣、补贴，样样要钱，村里这几天一分拿不出。',choices:[{label:'自己垫钱顶上',hint:'现金下降，声望上升',eff:{cash:-260,rep:8},npc:{mayor:6},log:'你从家里拿钱垫上，王伯记在了心里。'},{label:'挨家挨户去化缘',hint:'支持上升，现金小升',eff:{support:10,cash:80,form:-2},npc:{mayor:4},log:'你跑了一整天，凑来一笔带着体温的钱。'},{label:'先欠着，赢球再说',hint:'现金保住，风险上升',eff:{cash:60,support:-6,form:-3},log:'你把账先欠下，心里压了块石头。'}]},
{id:'sponsorVisit',title:'镇上企业想聊聊赞助',text:'一家板材厂愿意出钱，但要求球衣印满他们的logo，老板还要在开幕式上讲十分钟话。',mini:'sponsor',choices:[{label:'接受，钱最重要',hint:'现金大幅上升，支持下降',eff:{cash:400,support:-6,rep:2},npc:{mayor:3},log:'球衣印满了广告，但队伍终于有钱了。'},{label:'谈条件，只印胸前',hint:'现金上升，声望上升',eff:{cash:220,support:2,rep:5},npc:{coach:4},log:'你把logo谈到了胸前，双方都还算满意。'},{label:'婉拒，保住村的体面',hint:'支持上升，现金不变',eff:{support:8,rep:4},npc:{star:3},log:'你谢绝了赞助，村里人说你有骨气。'}]},
{id:'villagers',title:'有人在村口说闲话',text:'几个老人蹲在树下议论：一群半大孩子踢球，能踢出什么名堂，还不如去打工。',choices:[{label:'当众回怼',hint:'声望上升，支持下降',eff:{rep:5,support:-8},npc:{mayor:-4},log:'你呛了回去，围观的人散了，话却传开了。'},{label:'邀请他们来看训练',hint:'支持上升，状态小升',eff:{support:8,form:3},npc:{mayor:5},log:'老人们第一次站在场边看球，慢慢不说话了。'},{label:'不理会，用成绩说话',hint:'状态上升，人情一般',eff:{form:5,support:1},npc:{coach:3},log:'你把话咽下去，训练更狠了。'}]},
{id:'derby',title:'邻村德比，全村的眼睛都看着',text:'李队长赛前放话，说你们村队是“凑数的”。场边站满了人，连小学都放了学来看。',mini:'lineup',choices:[{label:'稳守反击，先不输',hint:'状态上升，声望小升',eff:{form:6,rep:3,support:2},npc:{rival:-2},log:'你排了稳阵，全场比赛咬得很紧。'},{label:'猛攻，当着全村人赢回来',hint:'声望大幅上升，风险上升',eff:{rep:9,support:8,form:-3},npc:{star:5,rival:-5},log:'你选了搏命打法，场面惨烈又热闹。'},{label:'让替补上，留力打后面',hint:'状态保住，支持下降',eff:{form:3,support:-7},npc:{star:-4},log:'你把主力按在板上，看台上传来嘘声。'}]},
{id:'rainy',title:'暴雨把场地泡成了泥塘',text:'开赛前一小时下起暴雨，场地中央积了水。有人提议改期，有人说冒雨踢才有看头。',choices:[{label:'冒雨踢，泥地更有村味',hint:'支持大幅上升，状态下降',eff:{support:10,form:-6,rep:4},npc:{star:4},log:'你们在泥里踢完，浑身是泥，看台却喊哑了嗓子。'},{label:'排水修场，延迟开赛',hint:'状态上升，现金下降',eff:{form:6,cash:-100,support:2},npc:{coach:4},log:'大家用铁锹挖开排水沟，场地终于能踢了。'},{label:'改期，安全第一',hint:'状态保住，支持下降',eff:{form:2,support:-5},log:'比赛改了期，有人理解，有人扫兴。'}]},
{id:'starForm',title:'阿龙连续三场没进球',text:'主力前锋阿龙低着头找到你：家里出了点事，训练老走神，怕拖累全队。',choices:[{label:'让他歇一场，宽慰他',hint:'支持上升，状态小升',eff:{support:6,form:3},npc:{star:8,coach:2},log:'你让他歇一场，阿龙眼眶红了。'},{label:'批评他，职业点',hint:'状态上升，人情下降',eff:{form:7},npc:{star:-8,coach:4},log:'你狠批了一顿，阿龙没吭声，训练更拼了。'},{label:'找他家里聊聊，帮着解决',hint:'人情大幅上升，现金下降',eff:{support:8,cash:-80,form:5},npc:{star:10,mayor:4},log:'你帮着跑了两趟，阿龙重新笑了。'}]},
{id:'media',title:'县里记者来采访',text:'县融媒体记者扛着机器来了，说村超火到了县里，想拍你们训练。这是扬名的机会，也可能暴露队里的窘迫。',choices:[{label:'全力配合，好好宣传',hint:'声望大幅上升，支持上升',eff:{rep:12,support:6},npc:{mayor:5},log:'报道播出后，隔壁村都来打听你们队。'},{label:'只让拍训练，藏起窘迫',hint:'声望上升，支持一般',eff:{rep:5,support:2},log:'你只开放了训练场，片子播出来四平八稳。'},{label:'婉拒，怕打扰队伍',hint:'状态上升，声望下降',eff:{form:4,rep:-4},npc:{coach:3},log:'你谢绝了镜头，队伍清静，但也少了一次机会。'}]},

function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).catch(function(){fallback(t)});return Promise.resolve(fallback(t))}
function fallback(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);return true}catch(e){return false}}

function roundRect(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function wrap(x,t,X,Y,W,lh){var chars=t.split(''),line='',y=Y;for(var i=0;i<chars.length;i++){var test=line+chars[i];if(x.measureText(test).width>W&&line){x.fillText(line,X,y);line=chars[i];y+=lh}else line=test}if(line)x.fillText(line,X,y);return y}
