<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>夜市人生 · 微信体验入口</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#eef1ff;
    background:radial-gradient(900px 520px at 50% -10%,#34345f 0%,#0f1220 68%);
    display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
    padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));
  }
  .wrap{width:min(430px,100%);background:linear-gradient(180deg,#1b2140,#12162b);border:1px solid #3a4270;border-radius:22px;padding:24px 20px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .logo{font-size:46px;text-align:center;margin-bottom:8px}
  h1{font-size:24px;text-align:center;letter-spacing:1px;margin-bottom:6px}
  .tag{text-align:center;color:#ffcf5c;font-size:12px;letter-spacing:3px;margin-bottom:20px}
  .steps{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin:14px 0 18px}
  .step{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:13px;line-height:1.6;color:#c9cff2}
  .num{flex:none;width:24px;height:24px;border-radius:50%;background:#2b325a;color:#ffcf5c;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .btn{
    display:block;width:100%;min-height:50px;line-height:50px;text-align:center;text-decoration:none;
    border:none;border-radius:14px;font-size:17px;font-weight:800;color:#17152a;
    background:linear-gradient(135deg,#ffcf5c,#ff9d4d);box-shadow:0 8px 22px rgba(255,160,70,.25);
    touch-action:manipulation;
  }
  .note{font-size:11px;color:#98a1cf;line-height:1.7;margin-top:14px}
  .mini{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
  .mini span{font-size:11px;color:#a8b0d8;background:#202643;border:1px solid #3a4270;border-radius:16px;padding:6px 10px}
</style>
</head>
<body>
  <main class="wrap">
    <div class="logo">🌃</div>
    <h1>夜市人生</h1>
    <div class="tag">摆 摊 模 拟 器</div>
    <div class="steps">
      <div class="step"><span class="num">1</span><span>建议竖屏体验，单手即可完成进货、接客、结算和经营决策。</span></div>
      <div class="step"><span class="num">2</span><span>游戏进度自动保存在当前手机浏览器，下次打开可继续经营。</span></div>
      <div class="step"><span class="num">3</span><span>先从小摊起步，亏损时可通过打零工、借款、预售、翻找和歇业继续。</span></div>
    </div>
    <a class="btn" href="index.html">开始我的夜市人生</a>
    <div class="mini"><span>零门槛上手</span><span>真实经营感</span><span>人生清单</span><span>神秘匣子</span></div>
    <div class="note">当前公众号体验版为免费 H5 版本，游戏内金币、分成、奖励均为虚拟数据，不产生真实扣款，也不包含自动续费或隐藏费用。后续如发布微信小游戏版本，将以微信平台审核与用户明示选择为准。</div>
  </main>
</body>
</html>
